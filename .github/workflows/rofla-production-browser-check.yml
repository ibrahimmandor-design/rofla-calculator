name: ROFLA production browser verification

on:
  push:
    branches:
      - main
    paths:
      - 'management/**'
      - '.github/workflows/rofla-production-browser-check.yml'

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Check inline JavaScript syntax
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('management/index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.lastIndexOf('</script>');
          if (start < 0 || end <= start) throw new Error('Inline application script not found');
          writeFileSync('/tmp/rofla-inline.js', html.slice(start + 8, end));
          EOF
          node --check /tmp/rofla-inline.js
      - name: Wait until this commit is live on GitHub Pages
        run: |
          url="https://ibrahimmandor-design.github.io/rofla-calculator/management/"
          for attempt in $(seq 1 36); do
            if curl -fsSL "$url" | grep -q 'ROFLA_BUILD_20261112_FINAL_HANDOVER_V34'; then
              echo "The expected build is live."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment ($attempt/36)..."
            sleep 10
          done
          echo "Timed out waiting for the expected production build."
          exit 1
      - name: Verify cloud session and save guards
        run: node management/tests/cloud-sync-guard-check.mjs
      - name: Verify live production app on desktop and iPhone
        env:
          ROFLA_BASE_URL: https://ibrahimmandor-design.github.io/rofla-calculator/management/
        run: node management/tests/functional-browser-test.mjs
